<section class="gallery section">
  <div class="gallery-grid">

    <div class="gallery-item" data-category="annual">
      <img src="https://picsum.photos/500/400?1" alt="Annual Function">
      <div class="overlay">Annual Function</div>
    </div>

    <div class="gallery-item" data-category="sports">
      <img src="https://picsum.photos/500/400?2" alt="Sports Day">
      <div class="overlay">Sports Day</div>
    </div>

    <div class="gallery-item" data-category="science">
      <img src="https://picsum.photos/500/400?3" alt="Science Lab">
      <div class="overlay">Science Lab</div>
    </div>

    <div class="gallery-item" data-category="campus">

    </div>

<script>
const galleryData = {
  annual: [1,2,3,4,5],
  sports: [6,7,8,9,10],
  science: [11,12,13,14,15],
  campus: [16,17,18,19,20]
};

const modal = document.getElementById("galleryModal");
const modalImg = document.getElementById("modalImage");
const counter = document.getElementById("imageCounter");

let currentImages = [];
let currentIndex = 0;

document.querySelectorAll(".gallery-item").forEach(item => {
  item.addEventListener("click", () => {
    const category = item.dataset.category;
    currentImages = galleryData[category];
    currentIndex = 0;
    openModal();
  });
});

function openModal() {
  modal.classList.add("active");
  updateImage();
}

function closeModal() {
  modal.classList.remove("active");
}

function updateImage() {
  modalImg.src = `https://picsum.photos/800/600?random=${currentImages[currentIndex]}`;
  counter.innerText = `${currentIndex + 1} / ${currentImages.length}`;
}

document.getElementById("nextBtn").onclick = () => {
  currentIndex = (currentIndex + 1) % currentImages.length;
  updateImage();
};

document.getElementById("prevBtn").onclick = () => {
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  updateImage();
};

document.getElementById("closeModal").onclick = closeModal;
</script>


<script src="js/main.js"></script>
